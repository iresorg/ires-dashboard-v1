<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRES</title>
    <style>
      /* Loading state styles that show before React loads */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #12096f 0%, #1e1b4b 50%, #312e81 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }

      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        animation: fadeIn 0.6s ease-out;
      }

      .logo-container {
        position: relative;
        animation: logoGlow 2s ease-in-out infinite;
      }

      .logo {
        height: 2rem;
        width: auto;
        filter: brightness(0) invert(1);
      }

      .logo-glow {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        filter: blur(1rem);
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .loading-text {
        color: rgba(255, 255, 255, 0.8);
        font-size: 1.125rem;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .loading-dots {
        display: flex;
        gap: 0.5rem;
      }

      .dot {
        width: 0.5rem;
        height: 0.5rem;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: dotBounce 1.4s ease-in-out infinite;
      }

      .dot:nth-child(2) {
        animation-delay: 0.1s;
      }

      .dot:nth-child(3) {
        animation-delay: 0.2s;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes logoGlow {
        0%, 100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }

      @keyframes ping {
        75%, 100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      @keyframes dotBounce {
        0%, 80%, 100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-10px);
        }
      }

      /* Hide loading screen when React takes over */
      .loading-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen that shows before React loads -->
    <div id="loading-screen">
      <div class="loading-container">
        <div class="logo-container">
          <img src="/src/shared/assets/logos/ires-logo-white.svg" alt="iRES Logo" class="logo">
          <div class="logo-glow"></div>
        </div>
        <div class="loading-text">Loading iRES...</div>
        <div class="loading-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/shared/main.tsx"></script>
    
    <script>
      // Hide the loading screen when React app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('loading-hidden');
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 1000); // Give React time to initialize
      });
    </script>
  </body>
</html>
